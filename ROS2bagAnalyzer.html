<script>
/* ===== rosbag2 core: CDR deserializer + message definitions + signal extraction ===== */
'use strict';

const APP_VERSION = '0.0.18';

const PRIMS = {
  bool:    { size: 1 }, byte:  { size: 1 }, char:   { size: 1 },
  int8:    { size: 1 }, uint8: { size: 1 },
  int16:   { size: 2 }, uint16:{ size: 2 },
  int32:   { size: 4 }, uint32:{ size: 4 },
  int64:   { size: 8 }, uint64:{ size: 8 },
  float32: { size: 4 }, float64:{ size: 8 },
};

class CdrReader {
  constructor(u8) {
    this.u8 = u8;
    this.dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    if (u8.byteLength < 4) throw new Error('CDR data too short');
    // encapsulation: [0]=0x00, [1]=representation (0x00 BE, 0x01 LE)
    this.le = (u8[1] & 1) === 1;
    this.o = 4;
  }
  align(n) {
    const rel = this.o - 4;
    const pad = (n - (rel % n)) % n;
    this.o += pad;
  }
  prim(t) {
    const s = PRIMS[t].size;
    if (s > 1) this.align(s);
    const o = this.o; this.o += s;
    switch (t) {
      case 'bool':   return this.u8[o] !== 0;
      case 'byte': case 'uint8': case 'char': return this.u8[o];
      case 'int8':   return this.dv.getInt8(o);
      case 'int16':  return this.dv.getInt16(o, this.le);
      case 'uint16': return this.dv.getUint16(o, this.le);
      case 'int32':  return this.dv.getInt32(o, this.le);
      case 'uint32': return this.dv.getUint32(o, this.le);
      case 'int64':  return Number(this.dv.getBigInt64(o, this.le));
      case 'uint64': return Number(this.dv.getBigUint64(o, this.le));
      case 'float32':return this.dv.getFloat32(o, this.le);
      case 'float64':return this.dv.getFloat64(o, this.le);
    }
  }
  string() {
    this.align(4);
    const len = this.dv.getUint32(this.o, this.le); this.o += 4;
    const end = this.o + len;
    // len includes trailing NUL
    let bytes = this.u8.subarray(this.o, Math.max(this.o, end - 1));
    this.o = end;
    if (typeof TextDecoder !== 'undefined') return new TextDecoder('utf-8').decode(bytes);
    return Buffer.from(bytes).toString('utf8');
  }
}

/* --- message definitions (field name, type spec) ---
   type spec: 'float64' | 'string' | 'pkg/msg/Type' | with '[N]' fixed array | '[]' sequence */
const T = 'builtin_interfaces/msg/Time';
const H = 'std_msgs/msg/Header';
const V3 = 'geometry_msgs/msg/Vector3';
const Q = 'geometry_msgs/msg/Quaternion';
const PT = 'geometry_msgs/msg/Point';

const MSG_DEFS = {
  'builtin_interfaces/msg/Time':     [['sec','int32'],['nanosec','uint32']],
  'builtin_interfaces/msg/Duration': [['sec','int32'],['nanosec','uint32']],
  'std_msgs/msg/Header':   [['stamp',T],['frame_id','string']],
  'std_msgs/msg/Bool':     [['data','bool']],
  'std_msgs/msg/Byte':     [['data','byte']],
  'std_msgs/msg/Char':     [['data','char']],
  'std_msgs/msg/Empty':    [],
  'std_msgs/msg/String':   [['data','string']],
  'std_msgs/msg/Float32':  [['data','float32']],
  'std_msgs/msg/Float64':  [['data','float64']],
  'std_msgs/msg/Int8':     [['data','int8']],
  'std_msgs/msg/Int16':    [['data','int16']],
  'std_msgs/msg/Int32':    [['data','int32']],
  'std_msgs/msg/Int64':    [['data','int64']],
  'std_msgs/msg/UInt8':    [['data','uint8']],
  'std_msgs/msg/UInt16':   [['data','uint16']],

function parseTypeSpec(spec) {
  let m = spec.match(/^(.+)\[(\d*)\]$/);
  if (m) {
    return { base: m[1], seq: m[2] === '', fixed: m[2] === '' ? null : parseInt(m[2], 10) };
  }
  return { base: spec, seq: false, fixed: null };
}

function readValue(r, base) {
  if (PRIMS[base]) return r.prim(base);
  if (base === 'string') return r.string();
  const def = MSG_DEFS[base];
  if (!def) throw new Error('unsupported type: ' + base);
  const obj = {};
  for (const [name, spec] of def) obj[name] = readField(r, spec);
  return obj;
}

function readField(r, spec) {
  const { base, seq, fixed } = parseTypeSpec(spec);
  if (!seq && fixed === null) return readValue(r, base);
  let n = fixed;
  if (seq) { r.align(4); n = r.dv.getUint32(r.o, r.le); r.o += 4; }
  if (n > 10_000_000) throw new Error('array too large: ' + n);
  const arr = new Array(n);
  for (let i = 0; i < n; i++) arr[i] = readValue(r, base);
  return arr;
}

function deserialize(u8, typeName) {
  const r = new CdrReader(u8);
  return readValue(r, typeName);
}


/* --- schema-driven ROS 2 CDR decoder (used by MCAP embedded schemas) --- */
function normalizeRosType(type, currentType) {

  t = t.replace(/^::/, '').replace(/::/g, '/');
  const aliases = {
    float: 'float32', double: 'float64', boolean: 'bool', octet: 'uint8',
    long: 'int32', 'unsigned long': 'uint32', 'long long': 'int64',
    'unsigned long long': 'uint64'

  if (aliases[t]) return aliases[t];
  if (PRIMS[t] || t === 'string') return t;
  if (t.includes('/')) {
    const parts = t.split('/');
    if (parts.length === 2) return parts[0] + '/msg/' + parts[1];
    return t;
  }
  const cur = currentType.split('/');
  return cur.length >= 3 ? cur[0] + '/msg/' + t : t;
}

function parseRos2MsgSchema(schemaName, text) {
  const defs = {};
  const delim = /^={20,}\r?\nMSG:\s*([^\r\n]+)\r?\n/gm;
  const sections = [];
  let last = 0, current = schemaName, m;
  while ((m = delim.exec(text)) !== null) {
    sections.push([current, text.slice(last, m.index)]);
    current = m[1].trim();
    last = delim.lastIndex;
  }
  sections.push([current, text.slice(last)]);

  for (const [rawName, body] of sections) {
    let name = rawName;
    if (name.split('/').length === 2) name = name.replace('/', '/msg/');
    const fields = [];
    for (let line of body.split(/\r?\n/)) {
      line = line.replace(/#.*/, '').trim();
      if (!line || line.includes('=')) continue; // comments/constants/default constants
      const mm = line.match(/^(\S+)\s+([A-Za-z_]\w*)/);
      if (!mm) continue;
      let type = mm[1].replace(/<=\d+/g, '');
      const arr = type.match(/^(.*)\[(\d*)\]$/);
      let spec;
      if (arr) spec = normalizeRosType(arr[1], name) + '[' + arr[2] + ']';
      else spec = normalizeRosType(type, name);
      fields.push([mm[2], spec]);
    }
    defs[name] = fields;
  }
  return defs;
}

function stripIdlAnnotations(text) {
  // ROS generated IDL annotations may contain quoted strings and nested parentheses.
  let out = '', i = 0;
  while (i < text.length) {
    if (text[i] !== '@') { out += text[i++]; continue; }
    while (i < text.length && text[i] !== '(' && text[i] !== '\n') i++;
    if (text[i] !== '(') { while (i < text.length && text[i] !== '\n') i++; continue; }
    let depth = 0, quote = false, escp = false;
    do {
      const ch = text[i++];
      if (quote) {
        if (escp) escp = false;
        else if (ch === '\\') escp = true;
        else if (ch === '"') quote = false;
      } else {
        if (ch === '"') quote = true;
        else if (ch === '(') depth++;
        else if (ch === ')') depth--;
      }
    } while (i < text.length && depth > 0);
  }
  return out;
}

function parseIdlFieldType(raw, currentType) {
  let t = raw.trim().replace(/\s+/g, ' ');
  const seq = t.match(/^sequence\s*<\s*(.+?)(?:\s*,\s*\d+)?\s*>$/);
  if (seq) return normalizeRosType(seq[1], currentType) + '[]';
  const arr = t.match(/^(.*?)\s*\[(\d+)\]$/);
  if (arr) return normalizeRosType(arr[1], currentType) + '[' + arr[2] + ']';
  if (/^string(?:\s*<\s*\d+\s*>)?$/.test(t)) return 'string';
  return normalizeRosType(t, currentType);
}

function parseRos2IdlSchema(schemaName, text) {
  const defs = {};
  const re = /^={20,}\r?\nIDL:\s*([^\r\n]+)\r?\n/gm;
  const sections = [];
  let m, last = 0, current = null;
  while ((m = re.exec(text)) !== null) {
    if (current !== null) sections.push([current, text.slice(last, m.index)]);
    current = m[1].trim(); last = re.lastIndex;
  }
  if (current !== null) sections.push([current, text.slice(last)]);
  if (!sections.length) sections.push([schemaName, text]);

  for (const [resource, raw] of sections) {
    let body = stripIdlAnnotations(raw).replace(/\/\/.*$/gm, '');
    const base = resource.split('/').pop();
    const sr = new RegExp('struct\\s+' + base.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&') + '\\s*\\{([\\s\\S]*?)\\}\\s*;');
    const sm = body.match(sr) || body.match(/struct\s+([A-Za-z_]\w*)\s*\{([\s\S]*?)\}\s*;/);
    if (!sm) continue;
    const structBody = sm.length === 2 ? sm[1] : sm[2];
    const fields = [];
    for (let stmt of structBody.split(';')) {

      if (!stmt || /^(module|struct|#)/.test(stmt)) continue;
      const fm = stmt.match(/^(.+?)\s+([A-Za-z_]\w*)$/);
      if (!fm) continue;
      fields.push([fm[2], parseIdlFieldType(fm[1], resource)]);
    }
    defs[resource] = fields;
  }
  return defs;
}

function readValueWithDefs(r, base, defs) {
  if (PRIMS[base]) return r.prim(base);
  if (base === 'string') return r.string();
  const def = defs[base] || MSG_DEFS[base];

}
function readFieldWithDefs(r, spec, defs) {
  const { base, seq, fixed } = parseTypeSpec(spec);
  if (!seq && fixed === null) return readValueWithDefs(r, base, defs);
  let n = fixed;
  if (seq) { r.align(4); n = r.dv.getUint32(r.o, r.le); r.o += 4; }
  if (n > 10_000_000) throw new Error('array too large: ' + n);
  const arr = new Array(n);
  for (let i = 0; i < n; i++) arr[i] = readValueWithDefs(r, base, defs);
  return arr;
}
function deserializeWithDefs(u8, typeName, defs) {
  const r = new CdrReader(u8);
  return readValueWithDefs(r, typeName, defs || {});
}

const MCAP_MAGIC = [0x89,0x4d,0x43,0x41,0x50,0x30,0x0d,0x0a];

/* --- flatten: numeric leaf paths --- */
const MAX_ARRAY_SIGNALS = 64; // Expose up to the first 64 array elements as signals

function flattenPaths(obj, prefix, out) {
  if (obj === null || obj === undefined) return;
  const t = typeof obj;
  if (t === 'number') { out.push(prefix); return; }
  if (t === 'boolean') { out.push(prefix); return; }
  if (t === 'string') return; // Strings are not plottable
  if (Array.isArray(obj)) {
    const n = Math.min(obj.length, MAX_ARRAY_SIGNALS);
    for (let i = 0; i < n; i++) flattenPaths(obj[i], prefix + '[' + i + ']', out);
    return;
  }
  for (const k of Object.keys(obj)) {
    flattenPaths(obj[k], prefix ? prefix + '.' + k : k, out);
  }
}

function getByPath(obj, path) {
  // path like "twist.linear.x" or "position[1]"
  let cur = obj;
  for (const part of path.split('.')) {
    if (cur == null) return null;
    const m = part.match(/^([^\[]+)((\[\d+\])*)$/);
    if (!m) return null;
    cur = cur[m[1]];
    if (m[2]) {
      for (const im of m[2].matchAll(/\[(\d+)\]/g)) {
        if (cur == null) return null;
        cur = cur[parseInt(im[1], 10)];
      }
    }
  }
  if (typeof cur === 'boolean') return cur ? 1 : 0;
  return typeof cur === 'number' ? cur : null;
}

/* --- bag reading (SQL.js Database instance) --- */
function readBagTopics(db) {
  const topics = [];
  const res = db.exec('SELECT id, name, type FROM topics ORDER BY name');
  if (!res.length) return topics;
  for (const row of res[0].values) {
    topics.push({ id: row[0], name: row[1], type: row[2], count: 0 });
  }
  const counts = db.exec('SELECT topic_id, COUNT(*) FROM messages GROUP BY topic_id');
  if (counts.length) {
    const map = new Map(counts[0].values.map(r => [r[0], r[1]]));
    for (const t of topics) t.count = map.get(t.id) || 0;
  }
  return topics;
}

function toBig(v) { return typeof v === 'bigint' ? v : BigInt(Math.round(Number(v))); }

function readTimeRange(db) {
  const res = db.exec('SELECT MIN(timestamp), MAX(timestamp) FROM messages');
  if (!res.length || res[0].values[0][0] === null) return null;
  return { min: toBig(res[0].values[0][0]), max: toBig(res[0].values[0][1]) };
}

function sampleMessage(db, topic) {
  const stmt = db.prepare('SELECT data FROM messages WHERE topic_id=? ORDER BY timestamp LIMIT 1');
  stmt.bind([topic.id]);
  let u8 = null;
  if (stmt.step()) u8 = stmt.get()[0];
  stmt.free();
  if (!u8) return null;
  return deserialize(u8, topic.type);
}

// Build the signal list from several initial messages to capture variable-length sequences.
function buildSignalList(db, topic, scanN) {
  scanN = scanN || 5;
  const stmt = db.prepare('SELECT data FROM messages WHERE topic_id=? ORDER BY timestamp LIMIT ?');
  stmt.bind([topic.id, scanN]);
  const set = new Set();
  let err = null;
  while (stmt.step()) {
    try {
      const obj = deserialize(stmt.get()[0], topic.type);
      const paths = [];
      flattenPaths(obj, '', paths);
      for (const p of paths) set.add(p);
    } catch (e) { err = e; break; }
  }
  stmt.free();
  if (err) throw err;
  return [...set];
}

// Extract time series for selected signals.
function extractSeries(db, topic, paths, t0ns, maxMessages) {
  maxMessages = maxMessages || 500000;
  const stmt = db.prepare('SELECT timestamp, data FROM messages WHERE topic_id=? ORDER BY timestamp LIMIT ?');
  stmt.bind([topic.id, maxMessages]);
  const times = [];
  const series = paths.map(() => []);
  const t0 = toBig(t0ns);
  while (stmt.step()) {
    let row;
    try { row = stmt.get(null, { useBigInt: true }); } catch (e) { row = stmt.get(); }
    const [ts, u8] = row;
    let obj;
    try { obj = deserialize(u8, topic.type); } catch (e) { continue; }
    times.push(Number(toBig(ts) - t0) / 1e9);
    for (let i = 0; i < paths.length; i++) series[i].push(getByPath(obj, paths[i]));
  }
  stmt.free();
  return { times, series };
}


/* --- Signal metadata: display names and engineering units --- */
function signalUnit(topicType, path) {
  const p = path.toLowerCase();
  const type = (topicType || '').toLowerCase();
  if (/(^|\.)nanosec$/.test(p)) return 'ns';
  if (/(^|\.)sec$/.test(p)) return 's';
  if (p.includes('steering_tire_angle')) return 'rad';
  if (p.includes('steering_tire_rotation_rate')) return 'rad/s';
  if (/(^|\.)jerk$/.test(p)) return 'm/s³';
  if (/(^|\.)acceleration$/.test(p) || p.includes('linear_acceleration')) return 'm/s²';
  if (p.includes('angular_acceleration')) return 'rad/s²';
  if (/(^|\.)speed$/.test(p)) return 'm/s';
  if (p.includes('angular_velocity')) return 'rad/s';
  if (p.includes('linear_velocity')) return 'm/s';
  if (p.includes('.twist.linear.') || p.startsWith('twist.linear.')) return 'm/s';
  if (p.includes('.twist.angular.') || p.startsWith('twist.angular.')) return 'rad/s';
  if (p.includes('.accel.linear.') || p.startsWith('accel.linear.')) return 'm/s²';
  if (p.includes('.accel.angular.') || p.startsWith('accel.angular.')) return 'rad/s²';
  if (/(position|translation|point)\.(x|y|z)$/.test(p)) return 'm';
  if (/latitude$|longitude$/.test(p)) return 'deg';
  if (/altitude$/.test(p)) return 'm';
  if (type.includes('sensor_msgs/msg/imu') && p.includes('orientation.')) return '';
  if (type.includes('geometry_msgs') && p.includes('orientation.')) return '';
  return '';
}
function signalLeafName(path) {
  const parts = path.split('.');

const PALETTE = ['#E4572E','#17A398','#3D6FD9','#D81E5B','#7A9E1A','#8E5AC8',
                 '#E09F1F','#0F8B8D','#C05299','#5C7457','#B23A48','#2E86AB'];

const MAX_POINTS_PER_TRACE = 200000;

function decimate(x, y) {
  if (x.length <= MAX_POINTS_PER_TRACE) return { x, y, decimated: false };
  const stride = Math.ceil(x.length / MAX_POINTS_PER_TRACE);
  const nx = [], ny = [];
  for (let i = 0; i < x.length; i += stride) { nx.push(x[i]); ny.push(y[i]); }
  return { x: nx, y: ny, decimated: true };
}

// items: [{label, color, times, values}] / mode: 'overlay' | 'split'
function buildPlot(items, mode) {
  const traces = [];
  const layout = {
    margin: { l: 60, r: 16, t: 8, b: 42 },
    showlegend: mode === 'overlay',
    legend: { orientation: 'h', y: -0.14 },
    hovermode: 'x unified',
    dragmode: 'zoom',
  };
  if (mode === 'split' && items.length > 1) {
    const n = items.length;
    const gap = Math.min(0.04, 0.3 / n);
    const h = (1 - gap * (n - 1)) / n;
    items.forEach((it, i) => {
      const d = decimate(it.times, it.values);
      const ax = i === 0 ? '' : String(i + 1);
      traces.push({ x: d.x, y: d.y, name: it.label, mode: 'lines',
        type: 'scattergl', line: { color: it.color, width: 1.5 },
        xaxis: 'x', yaxis: 'y' + ax, hoverinfo: 'x+y+name' });
      const top = 1 - i * (h + gap);
      layout['yaxis' + ax] = { domain: [top - h, top], title: { text: it.label, font: { size: 10 } },
        zeroline: false, gridcolor: '#E3E7E2' };
    });
    layout.xaxis = { anchor: 'y' + (items.length > 1 ? items.length : ''), title: { text: 'Time [s]' }, gridcolor: '#E3E7E2' };
    layout.hovermode = 'x';
  } else {
    for (const it of items) {
      const d = decimate(it.times, it.values);
      traces.push({ x: d.x, y: d.y, name: it.label, mode: 'lines',
        type: 'scattergl', line: { color: it.color, width: 1.5 }, hoverinfo: 'x+y+name' });
    }
    layout.xaxis = { title: { text: 'Time [s]' }, gridcolor: '#E3E7E2', zeroline: false };
    layout.yaxis = { gridcolor: '#E3E7E2', zeroline: false };
  }
  return { traces, layout };
}

function safeProjectName(name){return String(name||'dataset').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'')||'dataset';}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function u16le(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);return b;}
function u32le(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);return b;}
function u64le(v){const b=new Uint8Array(8);new DataView(b.buffer).setBigUint64(0,BigInt(v),true);return b;}
function catBytes(parts){const len=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length;}return out;}
function mcapStr(v){const b=new TextEncoder().encode(String(v));return catBytes([u32le(b.length),b]);}
function mcapBytes32(v){return catBytes([u32le(v.length),v]);}
function mcapRecord(op,content){return catBytes([new Uint8Array([op]),u64le(content.length),content]);}
function synthRos2Msg(type,seen=new Set()){if(seen.has(type)||!MSG_DEFS[type])return'';seen.add(type);const lines=MSG_DEFS[type].map(([n,t])=>t+' '+n).join('\n');let out=lines+'\n';for(const [,spec] of MSG_DEFS[type]){const base=parseTypeSpec(spec).base;if(MSG_DEFS[base])out+='==============================\nMSG: '+base.replace('/msg/','/')+'\n'+synthRos2Msg(base,seen);}return out;}
function firstLastMessagesForEntry(entry){if(entry.kind==='mcap'){const msgs=entry.mcap.messages.get(entry.channel.id)||[];if(!msgs.length)return[];return msgs.length===1?[msgs[0]]:[msgs[0],msgs[msgs.length-1]];}const stmt=entry.db.prepare('SELECT timestamp,data FROM messages WHERE topic_id=? ORDER BY timestamp');stmt.bind([entry.id]);const rows=[];if(stmt.step()){let r;try{r=stmt.get(null,{useBigInt:true});}catch(e){r=stmt.get();}rows.push({timestamp:toBig(r[0]),data:r[1]});}stmt.free();const tail=entry.db.prepare('SELECT timestamp,data FROM messages WHERE topic_id=? ORDER BY timestamp DESC LIMIT 1');tail.bind([entry.id]);if(tail.step()){let r;try{r=tail.get(null,{useBigInt:true});}catch(e){r=tail.get();}const x={timestamp:toBig(r[0]),data:r[1]};if(!rows.length||x.timestamp!==rows[0].timestamp)rows.push(x);}tail.free();return rows;}
function buildDummyMcap(bag){
  let schemaId=1,channelId=1,seq=0;const records=[],schemaByType=new Map();
  records.push(mcapRecord(0x01,catBytes([mcapStr('ros2'),mcapStr('ROS2bag Analyzer '+APP_VERSION)])));
  for(const bt of bag.topics.values()){
    let schema=null,encoding='ros2msg',schemaData=null;
    for(const e of bt.entries){if(e.kind==='mcap'){const sch=e.mcap.schemas.get(e.channel.schemaId);if(sch){schema=sch;encoding=sch.encoding;schemaData=sch.data;break;}}}
    if(!schemaData){const text=synthRos2Msg(bt.type);if(!text)continue;schemaData=new TextEncoder().encode(text);}
    let sid=schemaByType.get(bt.type);if(!sid){sid=schemaId++;schemaByType.set(bt.type,sid);records.push(mcapRecord(0x03,catBytes([u16le(sid),mcapStr(bt.type),mcapStr(encoding),mcapBytes32(schemaData)])));}
    const cid=channelId++;records.push(mcapRecord(0x04,catBytes([u16le(cid),u16le(sid),mcapStr(bt.name),mcapStr('cdr'),u32le(0)])));
    const candidates=[];for(const e of bt.entries)candidates.push(...firstLastMessagesForEntry(e));candidates.sort((a,b)=>a.timestamp<b.timestamp?-1:a.timestamp>b.timestamp?1:0);if(!candidates.length)continue;
    const selected=candidates.length===1?[candidates[0]]:[candidates[0],candidates[candidates.length-1]];
    for(const msg of selected){records.push(mcapRecord(0x05,catBytes([u16le(cid),u32le(seq++),u64le(msg.timestamp),u64le(msg.timestamp),msg.data])));}
  }
  records.push(mcapRecord(0x0F,u32le(0)));records.push(mcapRecord(0x02,catBytes([u64le(0),u64le(0),u32le(0)])));
  return catBytes([new Uint8Array(MCAP_MAGIC),...records,new Uint8Array(MCAP_MAGIC)]);
}
function currentProjectObject(datasetFiles,dummy,geoByPlotter){return{schemaVersion:'1.1',app:'ROS2bag Analyzer',appVersion:APP_VERSION,exportedAt:new Date().toISOString(),dummyDataset:!!dummy,layout:{columns:state.layoutColumns},cursor:{enabled:state.cursorEnabled,time:state.cursorTime},activePlotterId:state.activePlotterId,datasets:datasetFiles,plotters:state.plotters.map(p=>({id:p.id,name:p.name||('Plotter '+p.id),type:p.type,signalKeys:[...p.signalKeys],xyX:p.xyX,showMarkers:!!p.showMarkers,geojson:geoByPlotter.get(p.id)||[]}))};}
async function exportProject(){try{await ensureJSZip();const dummy=$('project-dummy').checked,zip=new JSZip(),datasets=[],geoByPlotter=new Map();for(const bag of enabledBagSets()){const dir='datasets/'+safeProjectName(bag.name)+'_'+bag.id;const files=[];if(dummy){const name='dummy.mcap',path=dir+'/'+name;zip.file(path,buildDummyMcap(bag));files.push({path,name,kind:'mcap'});}else{for(let i=0;i<bag.sources.length;i++){const src=bag.sources[i],name=safeProjectName(src.name||('source_'+(i+1)+(src.kind==='mcap'?'.mcap':'.db3'))),path=dir+'/'+name;zip.file(path,src.u8);files.push({path,name,kind:src.kind});}}datasets.push({name:bag.name,enabled:true,color:bag.color,originalSourceNames:(bag.originalSourceNames||bag.sources.map(s=>s.name)),files});}for(const p of state.plotters){const refs=[];for(const layer of (p.geojsonLayers||[])){const name=safeProjectName(layer.name||('map_'+layer.id+'.geojson')),fileName=/\.(geojson|json)$/i.test(name)?name:name+'.geojson',path='geojson/plotter_'+p.id+'/'+fileName;zip.file(path,JSON.stringify(layer.data));refs.push({name:layer.name,path});}geoByPlotter.set(p.id,refs);}zip.file('project.json',JSON.stringify(currentProjectObject(datasets,dummy,geoByPlotter),null,2));setBusy('Exporting project…');const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});downloadBlob(blob,'ROS2bagAnalyzer_project.zip');setBusy(null);toast('Project exported.');}catch(err){console.error(err);setBusy(null);toast('Project export failed: '+err.message,true);}}
function closeAllDatasets(){for(const bag of state.bagSets)for(const src of bag.sources||[])if(src.db)try{src.db.close();}catch(e){}state.bagSets=[];state.topics=[];state.cache.clear();state.signalMap.clear();state.plotters=[];state.nextPlotterId=1;state.nextBagId=1;state.nextGeojsonId=1;state.activePlotterId=null;}
async function importProjectFile(file){try{await ensurePlotly();await ensureJSZip();const zip=await JSZip.loadAsync(await file.arrayBuffer()),entry=zip.file('project.json');if(!entry)throw new Error('project.json was not found');const project=JSON.parse(await entry.async('string'));if(project.app!=='ROS2bag Analyzer')throw new Error('Unsupported project type');if(!Array.isArray(project.datasets)||!Array.isArray(project.plotters))throw new Error('Invalid project.json');closeAllDatasets();for(const ds of project.datasets){const loaded=[];for(const f of ds.files||[]){const ze=zip.file(f.path);if(!ze)throw new Error('Missing dataset file: '+f.path);const u8=await ze.async('uint8array');loaded.push({name:f.name||f.path.split('/').pop(),u8,kind:f.kind||(/\.mcap$/i.test(f.path)?'mcap':'sqlite')});}if(loaded.some(x=>x.kind==='sqlite'))await ensureSQL();const bag=addBagSet(loaded,ds.name||'Dataset',{replaceDummy:false});if(bag){bag.enabled=ds.enabled!==false;if(ds.color)bag.color=ds.color;bag.isDummy=!!project.dummyDataset;bag.originalSourceNames=Array.isArray(ds.originalSourceNames)?ds.originalSourceNames:(ds.files||[]).map(f=>f.name).filter(Boolean);}}state.plotters=[];for(const pp of (project.plotters||[])){const geojsonLayers=[];for(const g of (pp.geojson||[])){const ge=zip.file(g.path);if(!ge)throw new Error('Missing GeoJSON file: '+g.path);const data=normalizeGeoJSON(JSON.parse(await ge.async('string')));geojsonLayers.push({id:state.nextGeojsonId++,name:g.name||g.path.split('/').pop(),data});}state.plotters.push({id:Number(pp.id),name:pp.name||('Plotter '+Number(pp.id)),type:pp.type==='xy'?'xy':'time',signalKeys:Array.isArray(pp.signalKeys)?pp.signalKeys:[],xyX:pp.xyX||null,showMarkers:!!pp.showMarkers,geojsonLayers});}if(!state.plotters.length)state.plotters=[{id:1,name:'Plotter 1',type:'time',signalKeys:[],xyX:null,showMarkers:false,geojsonLayers:[]}];state.nextPlotterId=Math.max(...state.plotters.map(p=>p.id),0)+1;state.activePlotterId=state.plotters.some(p=>p.id===project.activePlotterId)?project.activePlotterId:state.plotters[0].id;setLayoutColumns(project.layout?.columns||1);state.cursorTime=Number(project.cursor?.time)||0;state.cursorEnabled=!!project.cursor?.enabled;updateCursorControls();rebuildTopics();setBusy(null);toast('Project imported.');}catch(err){console.error(err);setBusy(null);toast('Project import failed: '+err.message,true);}}

function walkEntry(entry){return new Promise(resolve=>{if(entry.isFile)entry.file(f=>resolve([f]),()=>resolve([]));else if(entry.isDirectory){const reader=entry.createReader(),all=[];const readBatch=()=>reader.readEntries(async ents=>{if(!ents.length){const nested=await Promise.all(all.map(walkEntry));resolve(nested.flat());return;}all.push(...ents);readBatch();},()=>resolve([]));readBatch();}else resolve([]);});}
function isInternalDrag(e){const t=[...(e.dataTransfer?.types||[])];return t.includes('application/x-ros2bag-signal')||t.includes('application/x-ros2bag-plotter');}
function setupFileDnD(){const overlay=$('drop-overlay');let depth=0,stop=e=>{e.preventDefault();e.stopPropagation();};window.addEventListener('dragenter',e=>{if(isInternalDrag(e))return;stop(e);depth++;overlay.classList.add('show');});window.addEventListener('dragleave',e=>{if(isInternalDrag(e))return;stop(e);depth=Math.max(0,depth-1);if(!depth)overlay.classList.remove('show');});window.addEventListener('dragover',e=>{if(isInternalDrag(e))return;stop(e);});window.addEventListener('drop',async e=>{if(isInternalDrag(e))return;stop(e);depth=0;overlay.classList.remove('show');try{let files=[...(e.dataTransfer.files||[])];const dirs=[];for(const item of [...(e.dataTransfer.items||[])]){if(item.kind!=='file'||typeof item.webkitGetAsEntry!=='function')continue;const en=item.webkitGetAsEntry();if(en?.isDirectory)dirs.push(en);}if(dirs.length){const nested=await Promise.all(dirs.map(walkEntry));files.push(...nested.flat());}const unique=new Map();for(const f of files)unique.set([f.name,f.size,f.lastModified].join('\u0000'),f);files=[...unique.values()];if(files.length)await handleFiles(files);else toast('No files were available from the drop operation.',true);}catch(err){console.error(err);setBusy(null);toast('Drop error: '+err.message,true);}});}
function plotTheme(){const dark=state.theme==='dark';return{paper:dark?'#182126':'rgba(0,0,0,0)',plot:dark?'#182126':'#ffffff',grid:dark?'#344148':'#e3e7e2',text:dark?'#e8eef1':'#2a343b',geo:dark?'#75838b':'#9aa6ad'};}
function applyTheme(theme){state.theme=theme==='dark'?'dark':'light';document.body.classList.toggle('theme-dark',state.theme==='dark');const b=$('btn-theme');if(b){b.textContent=state.theme==='dark'?'☀':'◐';b.title=state.theme==='dark'?'Switch to light mode':'Switch to dark mode';}renderPlotters();}
function toggleTheme(){applyTheme(state.theme==='dark'?'light':'dark');}
function toggleMaximizePlotter(id){state.maximizedPlotterId=state.maximizedPlotterId===id?null:id;renderPlotters();setTimeout(resizeAllPlotters,50);}
function resizeAllPlotters(){requestAnimationFrame(()=>{for(const p of state.plotters){const d=$('plot-'+p.id);if(d&&typeof Plotly!=='undefined')try{Plotly.Plots.resize(d);}catch(e){}}});}
function setLayoutColumns(n){state.layoutColumns=[1,2,3].includes(n)?n:1;for(const c of [1,2,3]){const top=$('layout-'+c);if(top)top.classList.toggle('active',state.layoutColumns===c);}$('plotters').classList.toggle('layout-2',state.layoutColumns===2);$('plotters').classList.toggle('layout-3',state.layoutColumns===3);setTimeout(resizeAllPlotters,40);}
async function toggleFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){toast('Fullscreen is not available in this browser.',true);}}

window.addEventListener('DOMContentLoaded',()=>{createPlotter();document.querySelectorAll('.side-section-head').forEach(btn=>btn.addEventListener('click',()=>{const sec=$(btn.dataset.section);sec.classList.toggle('open');if(sec.id==='section-signals'&&sec.classList.contains('open'))setTimeout(()=>renderSidebar(),0);}));setupFileDnD();$('file-input').addEventListener('change',e=>{handleFiles([...e.target.files]);e.target.value='';});$('btn-open').addEventListener('click',()=>$('file-input').click());$('btn-add-plotter').addEventListener('click',()=>createPlotter());$('btn-cursor').addEventListener('click',()=>setCursorEnabled(!state.cursorEnabled));$('btn-play-cursor').addEventListener('click',toggleCursorPlayback);$('btn-reset-time').addEventListener('click',resetCursorTime);$('layout-1').addEventListener('click',()=>setLayoutColumns(1));$('layout-2').addEventListener('click',()=>setLayoutColumns(2));$('layout-3').addEventListener('click',()=>setLayoutColumns(3));$('project-export').addEventListener('click',exportProject);$('project-import').addEventListener('click',()=>$('project-input').click());$('project-input').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)importProjectFile(f);e.target.value='';});$('bag-import').addEventListener('click',()=>$('bag-input').click());$('bag-input').addEventListener('change',e=>{handleFiles([...e.target.files]);e.target.value='';});$('btn-menu').addEventListener('click',()=>{document.body.classList.toggle('menu-collapsed');setTimeout(resizeAllPlotters,190);});$('btn-theme').addEventListener('click',toggleTheme);$('btn-fullscreen').addEventListener('click',toggleFullscreen);$('search').addEventListener('input',renderSidebar);window.addEventListener('resize',resizeAllPlotters);ensurePlotly().catch(()=>{});autoLoadFromHash();});
window.addEventListener('hashchange',autoLoadFromHash);
</script>
